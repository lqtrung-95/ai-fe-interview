<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Frontend Coach social preview</title>
  <desc id="desc">A simple Frontend Coach social preview with the logo, product name, tagline, and app URL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e1117"/>
      <stop offset="0.52" stop-color="#16182a"/>
      <stop offset="1" stop-color="#0a2b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="60" x2="1130" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e879a0"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4abad6"/>
    </linearGradient>
    <linearGradient id="logo-bg" x1="480" y1="86" x2="720" y2="326" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#21124f"/>
      <stop offset="1" stop-color="#062f3a"/>
    </linearGradient>
    <linearGradient id="logo-stroke" x1="500" y1="106" x2="700" y2="306" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.46" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="progress" x1="529" y1="236" x2="672" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020617" flood-opacity="0.44"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="78"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blurred"/>
      <feColorMatrix in="blurred" type="matrix" values="0 0 0 0 0.23 0 0 0 0 0.74 0 0 0 0 0.97 0 0 0 0.38 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="192" cy="132" r="172" fill="#e879a0" opacity="0.12" filter="url(#blur)"/>
  <circle cx="1010" cy="460" r="196" fill="#4abad6" opacity="0.13" filter="url(#blur)"/>
  <circle cx="600" cy="66" r="160" fill="#818cf8" opacity="0.10" filter="url(#blur)"/>

  <rect x="70" y="58" width="1060" height="514" rx="34" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.09)"/>
  <rect x="70" y="58" width="1060" height="5" fill="url(#accent)"/>

  <g filter="url(#shadow)">
    <rect x="493" y="94" width="214" height="214" rx="52" fill="url(#logo-bg)"/>
    <rect x="502" y="103" width="196" height="196" rx="44" fill="none" stroke="url(#logo-stroke)" stroke-width="5"/>
  </g>
  <path d="M566 164 536 200l30 36M634 164l30 36-30 36" fill="none" stroke="url(#logo-stroke)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M593 240 608 160" fill="none" stroke="#f8fafc" stroke-width="16" stroke-linecap="round" opacity="0.96"/>
  <g filter="url(#glow)">
    <path d="M549 231c28-1 49-12 64-34 18 13 37 17 58 10 18-6 32-20 44-44" fill="none" stroke="url(#progress)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M712 142v28h-28" fill="none" stroke="#67e8f9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="688" cy="139" r="15" fill="#f8fafc"/>
  <path d="M682 139.5 687 144l10-12" fill="none" stroke="#14b8a6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Plus Jakarta Sans, Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="398" fill="#ffffff" font-size="72" font-weight="800">Frontend Coach</text>
    <text x="600" y="452" fill="#b6c2d9" font-size="30" font-weight="500">Master your frontend interview with AI</text>
    <text x="600" y="508" fill="#7dd3fc" font-size="22" font-weight="700" letter-spacing="0.4">frontendcoach.app</text>
  </g>
</svg>
