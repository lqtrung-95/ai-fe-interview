<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Frontend Coach logo</title>
  <desc id="desc">A polished app mark combining frontend code brackets, a coaching signal, and an upward progress path.</desc>
  <defs>
    <linearGradient id="fc-bg" x1="28" y1="24" x2="230" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.48" stop-color="#21124f"/>
      <stop offset="1" stop-color="#062f3a"/>
    </linearGradient>
    <linearGradient id="fc-stroke" x1="42" y1="42" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.46" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="fc-progress" x1="77" y1="151" x2="183" y2="77" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="fc-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#050816" flood-opacity="0.35"/>
    </filter>
    <filter id="fc-glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.23 0 0 0 0 0.74 0 0 0 0 0.97 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>

  <rect width="256" height="256" fill="none"/>
  <g filter="url(#fc-shadow)">
    <rect x="22" y="22" width="212" height="212" rx="52" fill="url(#fc-bg)"/>
    <rect x="30" y="30" width="196" height="196" rx="44" fill="none" stroke="url(#fc-stroke)" stroke-width="5"/>
  </g>

  <path
    d="M93 91 61 128l32 37M163 91l32 37-32 37"
    fill="none"
    stroke="url(#fc-stroke)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M121 168 139 88"
    fill="none"
    stroke="#f8fafc"
    stroke-width="16"
    stroke-linecap="round"
    opacity="0.96"
  />

  <g filter="url(#fc-glow)">
    <path
      d="M76 151c18-1 31-8 41-22 12 8 25 11 39 7 13-4 23-14 31-31"
      fill="none"
      stroke="url(#fc-progress)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path d="M184 83v26h-26" fill="none" stroke="#67e8f9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <circle cx="190" cy="66" r="14" fill="#f8fafc"/>
  <path d="M184 66.5 189 71l9-11" fill="none" stroke="#14b8a6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
